<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <radialGradient id="crimsonBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9E1B1B"/>
      <stop offset="70%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#5A0000"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="192" height="192" rx="36" fill="url(#crimsonBg)"/>

  <!-- Outer Ring with Gold Border -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="96" cy="96" r="70" fill="#121212"/>

  <!-- Taiji (Âm Dương) Symbol -->
  <!-- White Hemisphere (Dương) -->
  <path d="M 96 26 A 70 70 0 0 1 96 166 A 35 35 0 0 1 96 96 A 35 35 0 0 0 96 26 Z" fill="#F8F8F8"/>
  <!-- Black Hemisphere (Âm) is formed by the dark circle background -->

  <!-- Yin eye (Đen trong phần trắng) -->
  <circle cx="96" cy="61" r="11" fill="#1A1A1A"/>
  <!-- Yang eye (Trắng trong phần đen) -->
  <circle cx="96" cy="131" r="11" fill="#F8F8F8"/>

  <!-- Gold Center Accent Ring -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
</svg>
