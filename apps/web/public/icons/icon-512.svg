<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <radialGradient id="crimsonBg512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9E1B1B"/>
      <stop offset="70%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#5A0000"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="96" fill="url(#crimsonBg512)"/>

  <!-- Outer Ring with Gold Border -->
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad512)" stroke-width="10"/>
  <circle cx="256" cy="256" r="186" fill="#121212"/>

  <!-- Taiji (Âm Dương) Symbol -->
  <!-- White Hemisphere (Dương) -->
  <path d="M 256 70 A 186 186 0 0 1 256 442 A 93 93 0 0 1 256 256 A 93 93 0 0 0 256 70 Z" fill="#F8F8F8"/>

  <!-- Yin eye (Đen trong phần trắng) -->
  <circle cx="256" cy="163" r="28" fill="#1A1A1A"/>
  <!-- Yang eye (Trắng trong phần đen) -->
  <circle cx="256" cy="349" r="28" fill="#F8F8F8"/>

  <!-- Gold Center Accent Ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#goldGrad512)" stroke-width="4" opacity="0.6"/>
</svg>
